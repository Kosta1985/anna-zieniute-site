name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build static website for annazieniute.com
        run: |
          rm -rf app/api
          npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://annazieniute.com
      - name: Add homepage redirect and preserve Next.js assets
        run: |
          test -f out/lt/index.html
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="lt">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=/lt/">
            <link rel="canonical" href="https://annazieniute.com/lt/">
            <title>Anna Zieniute</title>
          </head>
          <body>
            <p><a href="/lt/">Open Anna Zieniute / Atidaryti svetainę</a></p>
          </body>
          </html>
          HTML
          touch out/.nojekyll
      - name: Save production static build
        uses: actions/upload-artifact@v4
        with:
          name: anna-zieniute-static
          path: ./out
          if-no-files-found: error
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
